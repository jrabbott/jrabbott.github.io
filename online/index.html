<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jrabbott - Find Me Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            color: white;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .link-tile {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            padding: 30px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .link-tile:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .link-tile .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            color: white;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        footer a {
            color: white;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        footer a:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .links {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 Find Me Online</h1>
            <p class="tagline">Where to find me across the web</p>
        </header>

        <div class="links">
            <a href="https://jrabbott.github.io/" class="link-tile">
                <span class="icon">🌐</span>
                Website
            </a>

            <a href="https://www.linkedin.com/in/jonrabott" class="link-tile" target="_blank">
                <span class="icon">💼</span>
                LinkedIn
            </a>

            <a href="https://learn.microsoft.com/en-us/users/jrabott" class="link-tile" target="_blank">
                <span class="icon">📚</span>
                Microsoft Learn
            </a>

            <a href="https://app.pluralsight.com/profile/jrabott1983" class="link-tile" target="_blank">
                <span class="icon">🎓</span>
                Pluralsight
            </a>
        </div>

        <footer>
            <p>
                <a href="https://jrabbott.github.io/">← Back to hub</a>
            </p>
        </footer>
    </div>
</body>
</html>
