version: 2
updates:
  # Keep npm packages up-to-date (Astro, Starlight, etc.)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Keep GitHub Actions actions up-to-date (checkout, deploy-pages, etc.)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
