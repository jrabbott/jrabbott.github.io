name: CI

on:
  pull_request:
    # Keep pr-title in this workflow (one CI surface). Title/body edits
    # re-run build; that cost is accepted. Do not split into a separate
    # workflow, and do not skip build on edited (breaks required checks).
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Ensure section labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          create_label() {
            local name="$1" color="$2" desc="$3"
            if gh label list --json name -q '.[].name' | grep -qx "$name"; then
              echo "exists: $name"
            else
              gh label create "$name" --color "$color" --description "$desc"
              echo "created: $name"
            fi
          }
          create_label blog 0e8a16 'Changes under /blog/'
          create_label spec 1d76db 'Changes under /spec/'
          create_label career 5319e7 'Changes under /career/'
          create_label projects fbca04 'Changes under /projects/'
          create_label talks d93f0b 'Changes under /talks/'
          create_label reading 006b75 'Changes under /reading/'
          create_label online c5def5 'Changes under /online/'
          create_label search bfd4f2 'Changes under /search/'
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build
