name: CI

on:
  pull_request:
    # Keep pr-title in this workflow (one CI surface). Title/body edits
    # re-run build; that cost is accepted. Do not split into a separate
    # workflow, and do not skip build on edited (breaks required checks).
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/build
